<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360">
	<title>Dancing baby</title>
	<style>
		.limb {
		fill: none;
		stroke: #172033;
		stroke-width: 12;
		stroke-linecap: round;
		stroke-linejoin: round;
		}

		.body {
		fill: #8ed1dc;
		stroke: #172033;
		stroke-width: 5;
		}

		.skin {
		fill: #f5c7a9;
		stroke: #172033;
		stroke-width: 5;
		}

		.eye {
		fill: #172033;
		}

		.mouth {
		fill: none;
		stroke: #172033;
		stroke-width: 4;
		stroke-linecap: round;
		}

		.arm-left {
		transform-origin: 125px 205px;
		animation: armLeft 0.55s ease-in-out infinite alternate;
		}

		.arm-right {
		transform-origin: 235px 205px;
		animation: armRight 0.55s ease-in-out infinite alternate;
		}

		.leg-left {
		transform-origin: 155px 275px;
		animation: legLeft 0.55s ease-in-out infinite alternate;
		}

		.leg-right {
		transform-origin: 205px 275px;
		animation: legRight 0.55s ease-in-out infinite alternate;
		}

		.baby {
		transform-origin: 180px 250px;
		animation: bounce 0.55s ease-in-out infinite alternate;
		}

		@keyframes armLeft {
		from { transform: rotate(25deg); }
		to   { transform: rotate(-35deg); }
		}

		@keyframes armRight {
		from { transform: rotate(-25deg); }
		to   { transform: rotate(35deg); }
		}

		@keyframes legLeft {
		from { transform: rotate(-18deg); }
		to   { transform: rotate(20deg); }
		}

		@keyframes legRight {
		from { transform: rotate(18deg); }
		to   { transform: rotate(-20deg); }
		}

		@keyframes bounce {
		from { transform: translateY(0); }
		to   { transform: translateY(-12px); }
		}
	</style>

	<!-- Baby -->
	<g class="baby">

		<!-- Left arm -->
		<g class="arm-left">
			<path class="limb"
               d="M125 205 Q85 225 62 190"/>
			<circle class="skin"
                 cx="58" cy="185" r="11"/>
		</g>

		<!-- Right arm -->
		<g class="arm-right">
			<path class="limb"
               d="M235 205 Q275 225 298 190"/>
			<circle class="skin"
                 cx="302" cy="185" r="11"/>
		</g>

		<!-- Left leg -->
		<g class="leg-left">
			<path class="limb"
               d="M155 270 Q135 305 112 325"/>
			<ellipse class="skin"
                  cx="105" cy="331"
                  rx="22" ry="10"/>
		</g>

		<!-- Right leg -->
		<g class="leg-right">
			<path class="limb"
               d="M205 270 Q225 305 248 325"/>
			<ellipse class="skin"
                  cx="255" cy="331"
                  rx="22" ry="10"/>
		</g>

		<!-- Body -->
		<ellipse class="body"
               cx="180" cy="235"
               rx="58" ry="65"/>

		<!-- Head -->
		<circle class="skin"
              cx="180" cy="125"
              r="70"/>

		<!-- Hair -->
		<path d="M115 105
               Q120 55 155 48
               Q180 20 205 48
               Q240 55 245 105
               Q225 78 205 80
               Q180 55 155 80
               Q135 78 115 105Z"
            fill="#4a3025"
            stroke="#172033"
            stroke-width="5"/>

		<!-- Eyes -->
		<circle class="eye"
              cx="155" cy="125" r="6"/>
		<circle class="eye"
              cx="205" cy="125" r="6"/>

		<!-- Nose -->
		<circle class="skin"
              cx="180" cy="142" r="5"
              stroke="none"/>

		<!-- Happy mouth -->
		<path class="mouth"
            d="M155 158 Q180 180 205 158"/>

	</g>

</svg>